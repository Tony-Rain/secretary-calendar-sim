name: report

on:
  push:
    branches: [main]
    paths: ['docs/**']
  workflow_dispatch:

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: xu-cheng/latex-action@v3
        with:
          root_file: report.tex
          working_directory: docs
          latexmk_use_lualatex: false

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report
          path: |
            docs/report.pdf
            docs/report.log
